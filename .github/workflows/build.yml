name: Build TWRP 16 for taro

on:
  workflow_dispatch:
    inputs:
      product:
        description: Recovery product to build
        required: true
        default: twrp_taro
        type: choice
        options:
          - twrp_taro
          - twrp_taro_wifi

# No inputs here: concurrency is evaluated for every event, and the inputs
# context exists only for workflow_dispatch, so referencing it makes GitHub
# reject the whole file.
concurrency:
  group: twrp16-taro-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  recovery:
    name: recovery.img (${{ inputs.product }})
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 360
    env:
      TWRP_SOURCE: ${{ runner.temp }}/twrp-src-${{ github.run_id }}-${{ github.run_attempt }}
      TWRP_PRODUCT: ${{ inputs.product }}

    steps:
      - name: Check out device tree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: device-tree

      - name: Configure build output
        shell: bash
        run: |
          set -euo pipefail
          case "${TWRP_PRODUCT}" in
            twrp_taro)
              out_dir=out
              ;;
            twrp_taro_wifi)
              out_dir=out-taro-wifi
              ;;
            *)
              echo "Unsupported TWRP product: ${TWRP_PRODUCT}" >&2
              exit 1
              ;;
          esac
          echo "OUT_DIR=${out_dir}" >> "${GITHUB_ENV}"
          echo "PRODUCT_OUT=${TWRP_SOURCE}/${out_dir}/target/product/taro" >> "${GITHUB_ENV}"

      - name: Check build host capacity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${TWRP_SOURCE}"
          available_kib="$(df -Pk "${TWRP_SOURCE}" | awk 'NR == 2 { print $4 }')"
          memory_kib="$(awk '/^MemTotal:/ { print $2 }' /proc/meminfo)"
          if (( available_kib < 125829120 )); then
            echo 'TWRP 16 requires at least 120 GiB of free build disk.' >&2
            exit 1
          fi
          if (( memory_kib < 16777216 )); then
            echo 'TWRP 16 requires at least 16 GiB of RAM.' >&2
            exit 1
          fi
          df -h "${TWRP_SOURCE}"
          free -h

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates curl flex \
            g++-multilib gcc-multilib git gnupg gperf imagemagick \
            kmod \
            lib32ncurses-dev lib32readline-dev lib32z1-dev libelf-dev \
            liblz4-tool libncurses-dev libssl-dev libxml2-utils lz4 lzop \
            pngcrush repo rsync schedtool squashfs-tools unzip x11proto-core-dev \
            xsltproc zip zlib1g-dev zstd
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/*
          df -h "${TWRP_SOURCE}"

      - name: Sync TWRP 16 source
        shell: bash
        run: |
          set -euxo pipefail
          sudo install -d -o "$(id -u)" -g "$(id -g)" "${TWRP_SOURCE}"
          cd "${TWRP_SOURCE}"
          repo init \
            -u https://github.com/TWRP-Test/platform_manifest_twrp_aosp.git \
            -b twrp-16.0 \
            --depth=1 \
            --no-clone-bundle \
            --partial-clone \
            --clone-filter=blob:limit=10M
          mkdir -p .repo/local_manifests
          cp "${GITHUB_WORKSPACE}/device-tree/manifests/taro-twrp16.xml" \
            .repo/local_manifests/
          repo sync \
            -c \
            --fail-fast \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --prune \
            -j2
          du -sh "${TWRP_SOURCE}"
          df -h "${TWRP_SOURCE}"

      - name: Install device tree
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "${TWRP_SOURCE}/device/xiaomi/taro"
          rsync -a --delete \
            --exclude=.git \
            --exclude=.github \
            --exclude=.codex-cache \
            --exclude=.codex-context \
            "${GITHUB_WORKSPACE}/device-tree/" \
            "${TWRP_SOURCE}/device/xiaomi/taro/"
          for script in \
            recovery/root/system/bin/beforemodules.sh \
            recovery/root/system/bin/runatboot.sh \
            recovery/root/system/bin/unzip-zip64 \
            recovery/root/system/bin/waitforbattery.sh \
            scripts/apply-patches.sh \
            scripts/build.sh \
            scripts/taro-collect.sh \
            wifi/taro-wifi-control.sh \
            wifi/taro-wifi-dhcp.sh; do
            test -x "${GITHUB_WORKSPACE}/device-tree/${script}"
          done

      - name: Build recovery image
        shell: bash
        run: |
          set -eo pipefail
          cd "${TWRP_SOURCE}"
          bash device/xiaomi/taro/scripts/apply-patches.sh \
            "${TWRP_SOURCE}" "${TWRP_PRODUCT}"
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch "${TWRP_PRODUCT}-bp2a-eng"
          # Nothing in the recoveryimage graph stages the com.android.runtime
          # APEX, so crash_dump64 has to be asked for by path or the ramdisk
          # copy silently finds nothing.
          m -j4 "${PRODUCT_OUT}/apex/com.android.runtime/bin/crash_dump64" \
            2>&1 | tee "${GITHUB_WORKSPACE}/build.log"
          m -j4 recoveryimage 2>&1 | tee -a "${GITHUB_WORKSPACE}/build.log"

      - name: Verify image and runtime composition
        shell: bash
        run: |
          set -euxo pipefail
          image="${PRODUCT_OUT}/recovery.img"
          root="${PRODUCT_OUT}/recovery/root"
          test -s "${image}"
          test "$(stat -c %s "${image}")" -le 104857600

          for file in \
            "${root}/system/bin/qseecomd" \
            "${root}/system/bin/android.hardware.gatekeeper@1.0-service-qti" \
            "${root}/system/bin/android.hardware.keymaster@4.1-service-qti" \
            "${root}/system/bin/android.hardware.security.keymint-service-qti" \
            "${root}/vendor/lib64/libqtikeymint.so"; do
            test -x "${file}" || test -r "${file}"
          done

          for file in \
            "${root}/system/bin/android.hardware.security.keymint-service-qti" \
            "${root}/vendor/lib64/libqtikeymint.so"; do
            needed="$(readelf -d "${file}")"
            if grep -Fq -- '-ndk_platform.so' <<<"${needed}"; then
              echo "Legacy ndk_platform dependency remains in ${file}." >&2
              exit 1
            fi
            grep -Fq 'android.hardware.security.keymint-V4-ndk.so' <<<"${needed}"
            grep -Fq 'android.hardware.security.rkp-V3-ndk.so' <<<"${needed}"
          done

          grep -Fq 'vibrate_with_ff' \
            "${TWRP_SOURCE}/bootable/recovery/twrpminui/events.cpp"
          grep -Fq 'FF_CONSTANT' \
            "${TWRP_SOURCE}/bootable/recovery/twrpminui/events.cpp"
          grep -Fq 'TW_VENDOR_MODULES_PREPARE_SCRIPT' \
            "${TWRP_SOURCE}/bootable/recovery/kernel_module_loader.cpp"
          grep -Fq 'prepare_script_completed' \
            "${TWRP_SOURCE}/bootable/recovery/kernel_module_loader.cpp"
          grep -Fq 'persist_value_changed' \
            "${TWRP_SOURCE}/bootable/recovery/data.cpp"
          grep -Fq 'aidl_health_declared' \
            "${TWRP_SOURCE}/bootable/recovery/recovery_utils/battery_utils.cpp"
          grep -aFq 'effect type %d' \
            "${root}/system/lib64/libtwrpminui.so"
          test -x "${root}/system/bin/beforemodules.sh"
          test -x "${root}/system/bin/waitforbattery.sh"
          test -x "${root}/system/bin/hw/taro_health"
          test -f "${root}/system/etc/vintf/manifest/taro-health.xml"
          test ! -e "${root}/vendor/lib64/hw/android.hardware.health@2.0-impl-2.1-qti.so"

          # Copied out of the APEX by RECOVERY_BINARY_SOURCE_FILES, which has no
          # dependency on it being staged, so it goes missing without a word.
          test -s "${root}/system/bin/crash_dump64"
          test -s "${root}/system/bin/unzip-zip64"
          test -s "${root}/system/lib64/libusbhost.so"
          grep -aFq 'Running vendor module prepare script' \
            "${root}/system/bin/recovery"
          grep -aFq 'Apex is disabled in this build' \
            "${root}/system/bin/recovery"
          grep -Fq 'start twrp-wait-for-battery' \
            "${root}/init.recovery.qcom.rc"
          grep -Fq 'on property:twrp.battery.ready=true' \
            "${root}/init.recovery.qcom.rc"
          ! grep -Fq 'start boot-hal-1-2' \
            "${root}/init.recovery.qcom.rc"
          ! grep -Fq 'vendor.boot-hal-1-2' \
            "${root}/init.recovery.qcom.rc"
          ! grep -Fq 'install_keyring' \
            "${root}/init.recovery.qcom.rc"
          ! grep -Fq 'umount /firmware' \
            "${root}/init.recovery.qcom.rc"
          grep -Fq 'umount /firmware' \
            "${root}/system/bin/waitforbattery.sh"
          grep -Fq 'firmware_cleanup' \
            "${root}/system/bin/waitforbattery.sh"
          ! grep -q $'\r' \
            "${root}/system/etc/twrp.flags"
          ! grep -Eq '^/mi_ext[[:space:]]' \
            "${root}/system/etc/twrp.flags"
          test "$(grep -Ec '^mi_ext[[:space:]]+/mi_ext[[:space:]]+' \
            "${root}/system/etc/recovery.fstab")" -eq 2
          grep -E '^mi_ext[[:space:]]+/mi_ext[[:space:]].*[[:space:],]logical([[:space:],]|$).*[[:space:],]nofail([[:space:],]|$)' \
            "${root}/system/etc/recovery.fstab"
          ! grep -Fq 'wait /sys/class/power_supply/battery' \
            "${root}/init.recovery.qcom.rc"
          grep -Fq 'value="620"' \
            "${root}/twres/ui.xml"
          grep -aFq '3.7.1_16-taro-for-lingqiqi' \
            "${root}/system/bin/recovery"

          for legacy_vibrator_file in \
            "${root}/system/bin/vendor.qti.hardware.vibrator.service" \
            "${root}/system/etc/init/vendor.qti.hardware.vibrator.service.rc" \
            "${root}/vendor/etc/vintf/manifest/vendor.qti.hardware.vibrator.service.xml" \
            "${root}/vendor/lib64/libaachaptics.so" \
            "${root}/vendor/lib64/libqtivibratoreffect.xiaomi.so" \
            "${root}/vendor/lib64/libqtivibratoreffectoffload.so" \
            "${root}/vendor/lib64/vendor.qti.hardware.vibrator.impl.so" \
            "${root}/vendor/lib64/vendor.qti.hardware.vibratorOL.impl.so" \
            "${root}/vendor/lib64/vendor.qti.hardware.vibratorSel.impl.so"; do
            test ! -e "${legacy_vibrator_file}"
          done

          while IFS= read -r -d '' file; do
            needed="$(readelf -d "${file}" 2>/dev/null || true)"
            if grep -Fq -- '-ndk_platform.so' <<<"${needed}"; then
              echo "Legacy ndk_platform dependency remains in ${file}." >&2
              exit 1
            fi
          done < <(find "${root}" -type f -print0)

          test -f "${root}/vendor/etc/init/taro-security.rc"
          test -f "${root}/system/etc/recovery.fstab"
          test -f "${root}/system/etc/vintf/manifest.xml"
          test -f "${root}/vendor/etc/vintf/manifest.xml"
          test -f "${root}/vendor/etc/vintf/manifest/taro-security.xml"
          cmp -s \
            "${TWRP_SOURCE}/device/xiaomi/taro/recovery.fstab" \
            "${TWRP_SOURCE}/device/xiaomi/taro/recovery/root/system/etc/recovery.fstab"
          grep -Eq '^/dev/block/(by-name|bootdevice/by-name)/metadata[[:space:]]+/metadata[[:space:]].*[[:space:],]wrappedkey([[:space:],]|$)' \
            "${root}/system/etc/recovery.fstab"
          grep -Fq 'android.hidl.manager' \
            "${root}/system/etc/vintf/manifest.xml"
          grep -Fq 'type="device"' \
            "${root}/vendor/etc/vintf/manifest.xml"
          grep -Fq 'hwservicemanager.ready=true && property:vendor.sys.listeners.registered=true' \
            "${root}/vendor/etc/init/taro-security.rc"
          grep -Fq 'hwservicemanager.ready=true && property:vendor.sys.listeners.registered=true' \
            "${root}/vendor/etc/init/android.hardware.security.keymint-service-qti.rc"

          case "${TWRP_PRODUCT}" in
            twrp_taro)
              grep -qx 'TW_INCLUDE_WIFI := true' \
                "${TWRP_SOURCE}/device/xiaomi/taro/BoardConfig.mk"
              for file in \
                "${root}/system/bin/taro-wifi-control" \
                "${root}/system/bin/taro-wifi-dhcp" \
                "${root}/system/bin/wpa_cli" \
                "${root}/system/bin/wpa_supplicant" \
                "${root}/system/bin/taro_wifi_halctl" \
                "${root}/system/etc/init/taro-recovery-wifi.rc" \
                "${root}/vendor/bin/hw/android.hardware.wifi@1.0-service" \
                "${root}/vendor/etc/wifi/vendor_cmd.xml" \
                "${root}/vendor/lib/modules/cfg80211.ko" \
                "${root}/vendor/lib/modules/qca_cld3_qca6490.ko" \
                "${root}/vendor/lib64/android.hardware.wifi@1.0.so" \
                "${root}/vendor/lib64/libcld80211.so" \
                "${root}/vendor/lib64/libwifi-hal-ctrl.so" \
                "${root}/vendor/lib64/libwifi-hal-qcom.so" \
                "${root}/vendor/lib64/libwifi-hal.so" \
                "${root}/vendor/lib64/libwifi-system-iface.so"; do
                test ! -e "${file}"
              done
              ;;
            twrp_taro_wifi)
              for file in \
                "${root}/system/bin/dhcpdbg" \
                "${root}/system/bin/taro-wifi-control" \
                "${root}/system/bin/taro-wifi-dhcp" \
                "${root}/system/bin/wpa_cli" \
                "${root}/system/bin/wpa_supplicant" \
                "${root}/system/bin/taro_wifi_halctl" \
                "${root}/vendor/bin/hw/android.hardware.wifi@1.0-service"; do
                test -x "${file}"
              done
              for file in \
                "${root}/system/etc/init/taro-recovery-wifi.rc" \
                "${root}/vendor/etc/wifi/taro_recovery_wpa_supplicant.conf" \
                "${root}/vendor/etc/wifi/qca6490/WCNSS_qcom_cfg.ini" \
                "${root}/vendor/etc/vintf/manifest/android.hardware.wifi@1.0-service.xml" \
                "${root}/vendor/lib/modules/cfg80211.ko" \
                "${root}/vendor/lib/modules/qca_cld3_qca6490.ko"; do
                test -r "${file}"
              done
              grep -Fq 'update_config=0' \
                "${root}/vendor/etc/wifi/taro_recovery_wpa_supplicant.conf"
              ! grep -Eq '^(network|ssid|psk|sae_password)=' \
                "${root}/vendor/etc/wifi/taro_recovery_wpa_supplicant.conf"
              grep -Fq 'service vendor.wifi_hal_legacy' \
                "${root}/system/etc/init/taro-recovery-wifi.rc"
              test "$(grep -Fc 'seclabel u:r:recovery:s0' \
                "${root}/system/etc/init/taro-recovery-wifi.rc")" -eq 2
              grep -Fq 'Authentication rejected; check the password and security mode' \
                "${TWRP_SOURCE}/bootable/recovery/gui/action.cpp"
              grep -Fq 'net.${iface}.${property}' \
                "${root}/system/bin/taro-wifi-control"
              grep -Fq 'CONFIG_CTRL_IFACE_DIR=\"/data/vendor/wifi/wpa/sockets\"' \
                "${TWRP_SOURCE}/external/wpa_supplicant_8/wpa_supplicant/Android.bp"
              (
                cd "${TWRP_SOURCE}/device/xiaomi/taro/wifi/prebuilt"
                sha256sum -c SHA256SUMS
              )
              while read -r expected relative; do
                printf '%s  %s/%s\n' "${expected}" "${root}" "${relative}"
              done < "${TWRP_SOURCE}/device/xiaomi/taro/wifi/prebuilt/SHA256SUMS" |
                sha256sum -c -
              cmp -s \
                "${TWRP_SOURCE}/device/xiaomi/taro/wifi/prebuilt/vendor/etc/wifi/qca6490/WCNSS_qcom_cfg.ini" \
                "${root}/vendor/firmware/wlan/qca_cld/qca6490/WCNSS_qcom_cfg.ini"
              xmllint --noout \
                "${root}/vendor/etc/vintf/manifest/android.hardware.wifi@1.0-service.xml"
              "${TWRP_SOURCE}/${OUT_DIR}/host/linux-x86/bin/host_init_verifier" \
                "${root}/system/etc/init/taro-recovery-wifi.rc"
              for module in cfg80211.ko qca_cld3_qca6490.ko; do
                case "$(modinfo -F vermagic "${root}/vendor/lib/modules/${module}")" in
                  5.10.261-Glow-v5.0*)
                    ;;
                  *)
                    echo "Unexpected ${module} vermagic." >&2
                    exit 1
                    ;;
                esac
              done
              ;;
          esac

          "${TWRP_SOURCE}/${OUT_DIR}/host/linux-x86/bin/avbtool" \
            info_image --image "${image}"
          sha256sum "${image}" | tee "${GITHUB_WORKSPACE}/recovery.sha256"
          file "${image}"

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: twrp-16-taro-${{ inputs.product }}-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build.log
            recovery.sha256
            ${{ env.TWRP_SOURCE }}/out/target/product/taro/recovery.img
            ${{ env.TWRP_SOURCE }}/out-taro-wifi/target/product/taro/recovery.img
